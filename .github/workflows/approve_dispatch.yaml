---
name: Approve Pull Request (workflow_dispatch)
run-name: Approve Pull Request (${{ inputs.repository_owner }}/${{ inputs.repository_name }}/${{ inputs.pull_request_number }})
on:
  workflow_dispatch:
    inputs:
      repository_owner:
        required: true
      repository_name:
        required: true
      pull_request_number:
        required: true
jobs:
  approve:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: main
    permissions: {}
    steps:
      # The inputs repository_owner, repository_name, and pull_request_number
      # are read from the workflow_dispatch event.
      - uses: csm-actions/approve-pr-action@pr/526
        with:
          github_token: ${{ secrets.PR_APPROVE_GITHUB_ACCESS_TOKEN }}
          app_id: ${{ vars.DEMO_SERVER_APP_ID }}
          app_private_key: ${{ secrets.DEMO_SERVER_PRIVATE_KEY }}
          # Temporarily allow suzuki-shunsuke to test csm-actions/approve-pr-action#526
          allowed_committers: suzuki-shunsuke
