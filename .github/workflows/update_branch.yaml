---
name: Update Branch
run-name: Update Branch (${{ github.event.label.description }})
on:
  label:
    types:
      - created
jobs:
  update_branch:
    if: startsWith(github.event.label.name, 'update-branch-')
    name: Update Branch (${{ github.event.label.description }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: main
    permissions: {}
    steps:
      - uses: csm-actions/update-branch-action@eff8b88c983b2f52c844461797963c375cc2d360 # v1.2.1
        with:
          app_id: ${{ vars.DEMO_SERVER_APP_ID }}
          app_private_key: ${{ secrets.DEMO_SERVER_PRIVATE_KEY }}
