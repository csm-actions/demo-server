---
name: Update Branch (workflow_dispatch)
run-name: Update Branch (${{ inputs.repository_owner }}/${{ inputs.repository_name }}/${{ inputs.pull_request_number }})
on:
  workflow_dispatch:
    inputs:
      repository_owner:
        required: true
      repository_name:
        required: true
      pull_request_number:
        required: true
jobs:
  update_branch:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: main
    permissions: {}
    steps:
      # The inputs repository_owner, repository_name, and pull_request_number
      # are read from the workflow_dispatch event.
      - uses: csm-actions/update-branch-action@pr/603
        with:
          app_id: ${{ vars.DEMO_SERVER_APP_ID }}
          app_private_key: ${{ secrets.DEMO_SERVER_PRIVATE_KEY }}
